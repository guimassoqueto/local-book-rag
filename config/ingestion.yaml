pdf:
  # pymupdf reads most books quickly. docling runs layout models over the pages, which is
  # slower and suits complex layouts.
  extractor: pymupdf
  extract_tables: true

  ocr:
    # Scanned PDFs go through Docling's OCR when enabled, and are rejected otherwise.
    enabled: false


normalization:
  remove_repeated_margins: true


languages:
  # ISO 639-1 codes. A book in any other language is rejected.
  supported: [en, pt, es, fr, de, it]


chunking:
  strategy: structural

  target_size: 500
  overlap: 80

  unit: tokens

  preserve:
    chapters: true
    sections: true
    paragraphs: true
    page_numbers: true
