generation:
  question_answering:
    temperature: 0.2

    # Reasoning counts against this limit, so it has to leave room for the answer too.
    max_tokens: 1500

  summarization:
    temperature: 0.2

    # The limit for the final summary.
    max_tokens: 3000

    # The limit for each intermediate summary of the map-reduce steps.
    map_max_tokens: 900

    # How close a passage has to be to a statement to be cited as its source, in the score of
    # dense retrieval. Statements with no such passage stay uncited, and are counted.
    min_source_score: 0.6

    # Have the model check the final summary against the passages it cites.
    verify_claims: false

    types:
      brief:
        target_words: 200
        style: Keep to the essentials. One or two sentences per section are enough.

      standard:
        target_words: 500
        style: Cover the main points of each section.

      comprehensive:
        target_words: 1200
        style: Cover every argument and concept of the chapter.

      analytical:
        target_words: 2000
        max_tokens: 4000
        style: >-
          Go beyond listing the content: explain how the arguments build on each other, what
          they assume, and how the concepts depend on each other, while staying within what
          the chapter says.

  # Quizzes on a chapter or a whole book: one question per passage, written by llm.model.
  quiz:
    temperature: 0.2

    # Reasoning counts against this limit, so it has to leave room for the question too.
    max_tokens: 1500

    # The default number of questions: one per this many words of the chosen text, rounded
    # half up, at least 1 and at most default_max.
    words_per_question: 300
    default_max: 20

    # The most questions a quiz can have, and the number of question slots in the Quiz tab.
    max_questions: 50

    # Tries at one passage, for a reply that can't be read or a question not in form, before
    # another passage is used.
    attempts_per_passage: 3

    # A second reading of each question against its passage, which rejects a key the passage
    # doesn't state, a wrong key, or a second defensible answer. It ships switched on only if it
    # passes the rule of specs/003-chapter-quiz (FR-027), measured with the quiz_check experiment.
    check:
      enabled: false

      # The checker. null means llm.model. Another model needs an entry in llm_profiles.
      model: null

      # Replaces the checker's profile setting, as a judge's does: a judge should read before it
      # rates. null keeps the profile's.
      reasoning: medium

      max_tokens: 2000

  context:
    # Upper bound for llm.context_size in models.yaml, which sets the active window.
    max_size: 16384

    # Share of the window left unused, to absorb the error of approximate tokenizers. Ollama
    # silently cuts a prompt that doesn't fit, and answers from what remains.
    safety_margin: 0.1

  # Offered in the interface. Any language a model can write in works here.
  response_languages: [English, Portuguese, Spanish, French, German, Italian]
