# Every tag below was checked against the Ollama registry on 2026-11-06.
llm:
  provider: ollama
  model: gpt-oss:20b

  # num_ctx sent to Ollama. Benchmarks raise it up to generation.context.max_size.
  context_size: 8192

  # Defaults; the tasks in generation.yaml override them.
  temperature: 0.2
  max_tokens: 1500


embedding:
  provider: ollama
  model: qwen3-embedding:0.6b

  # Checked against the loaded model, and stored with the index configuration.
  dimensions: 1024
  batch_size: 16

  # Measured with qwen3-embedding:0.6b on the RTX 5060 Ti and the Ryzen 9 9950X3D.
  # Indexing is 12 times faster on the GPU: 59 chunks per second against 5.
  document_device: gpu

  # A query takes 16 ms on the CPU, and the LLM keeps the GPU to itself. On the GPU it
  # takes 6 ms, but it loads the embedding model next to the LLM.
  query_device: cpu


reranker:
  provider: transformers
  model: Qwen/Qwen3-Reranker-0.6B

  # Scoring the 24 passages of a typical search takes 4 s on the CPU and 0.6 s on the GPU
  # (cuda), where the model only stays in VRAM while it scores.
  device: cpu
  batch_size: 8


# Model-specific behavior, by model name. Switching llm.model or embedding.model selects the
# matching entry, so that no model name has to change anywhere else.
llm_profiles:
  gpt-oss:20b:
    # Matches Ollama's own token count exactly.
    tokenizer:
      kind: tiktoken
      name: o200k_harmony

    # Sent as Ollama's `think` option, and checked against the model's capabilities before
    # the first inference. gpt-oss takes low, medium or high, and reasons whatever it is told;
    # models that can switch it off take true or false; null sends nothing.
    reasoning: low

  gemma4:12b:
    # Gemma's own tokenizer needs a Hugging Face login, so this is an approximation, which
    # generation.context.safety_margin absorbs.
    tokenizer:
      kind: tiktoken
      name: o200k_base

  qwen3.5:9b:
    tokenizer:
      kind: huggingface
      name: Qwen/Qwen3.5-9B

  qwen3:14b:
    tokenizer:
      kind: huggingface
      name: Qwen/Qwen3-14B


embedding_profiles:
  qwen3-embedding:0.6b:
    tokenizer:
      kind: huggingface
      name: Qwen/Qwen3-Embedding-0.6B

    # From the Qwen3-Embedding model card: queries get an instruction, documents do not.
    query_template: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:{text}"

  bge-m3:
    tokenizer:
      kind: huggingface
      name: BAAI/bge-m3

    query_template: "{text}"
