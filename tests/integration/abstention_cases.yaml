  question: The book says class interfaces can be discovered in the same way as function interfaces. How
    do the steps of data encapsulation parallel those of encapsulation and generalization?
  reply: |-
    The book states that class interfaces can be discovered by "data encapsulation," which is a different development plan used when it is less obvious what objects are needed and how they should interact [1].

    While the text does not provide a direct step-by-step parallel between the two processes, it describes the components of each:

    *   **Encapsulation and Generalization:** This is a development plan for discovering function interfaces. It involves starting with a small program with no function definitions, identifying a coherent piece of it to encapsulate into a function, generalizing that function by adding parameters, and repeating the process [3].
    *   **Data Encapsulation:** This is used to discover class interfaces. The text provides an example where global variables (which limit a program to running one analysis at a time) are encapsulated into an object's state (e.g., a `Markov` class) to allow multiple separate analyses to run simultaneously [1].

    This suggests that while "encapsulation and generalization" focuses on moving code into functions and adding parameters, "data encapsulation" focuses on moving state into objects to manage interactions and independence.
  note: A partial answer.
