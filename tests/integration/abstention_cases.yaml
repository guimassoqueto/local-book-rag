  question: How does a child class use super() to call the __init__ method of its parent class?
  reply: |-
    En Python, cuando una clase hija necesita ejecutar el código de inicialización de su clase padre, puede hacerlo llamando a `super().__init__()` dentro de su propio método `__init__`.
    El método `super()` devuelve un objeto que actúa como proxy a la clase padre, y al invocarlo con `__init__()` se ejecuta la lógica de inicialización definida en la clase ancestro.

    En el capítulo de herencia del libro *think‑python* se muestra que, si la clase hija define su propio `__init__`, ese método **sobrescribe** el de la clase padre; por lo tanto, para que la inicialización del padre siga ocurriendo, la hija debe llamar explícitamente a `super().__init__()` dentro de su constructor.
    Esto permite que la hija extienda la funcionalidad del padre sin perder la configuración que éste realiza (por ejemplo, crear la lista de cartas en un `Deck`).

    Referencia: [1] (capítulo “Inheritance”, sección “Inheritance”).
