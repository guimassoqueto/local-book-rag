    enough to be coded in a few dozen lines, and rich enough"). Relationships and conclusion 5 say
    "The Markov example demonstrates how inheritance can be combined with encapsulation", though the
    chunks' Markov example uses no inheritance (the summary itself concedes "The inheritance
    hierarchy is not explicit"). Main argument 6 and conclusions 3 and 6 make the data-encapsulation
    plan advice for when "the hierarchy is ... murky". In the chunks, it's for when it's unclear
    what objects are needed. They also say the chapter "ends by encouraging the reader to reflect",
    but it ends with a glossary and exercises. Example 6 says dependencies "are omitted for
    clarity", where the chunks say "There are no dependencies in this diagram". Main argument 2's
    Hand.__init__ lookup [3] lands on Card's __init__ (lookup, not counted).
- item: Inheritance@probe
  kind: probe_summary
  model: gemma4:12b
  errors: [unsupported_claim]
  note: >-
    Analytical, English, 3 steps. Main arguments open with "The Necessity of Proper Class Design:
    Before introducing inheritance, the author argues that a class must be well-designed to be
    useful", an argument the chunks don't make: they just build Card. Its lookup [11] lands on the
    class-diagram chunk. Relationships says the data-encapsulation plan uses "the principles of
    class construction and inheritance", but the chunks' four steps and the Markov class involve no
    inheritance. Calling pop_card a veneer is not counted: the chunks name add_card, but the
    glossary's definition fits pop_card too. gpt-oss's analytical summary has the same kind of
    error, so this one isn't gemma4-only.
