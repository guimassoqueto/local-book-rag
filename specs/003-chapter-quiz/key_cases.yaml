# Known cases for the quiz's key check (specs/003-chapter-quiz, FR-026, FR-027).
#
# Each case is a quiz question whose key was judged by reading it against its passage, by FR-020's
# rubric: sound when the key is right according to the passage, it is the only defensible option,
# and the explanation says nothing the passage doesn't; flawed otherwise, with its reasons. The
# owner reviews every flawed label and a sample of the sound ones before FR-027's rule is applied.
#
# A case locates its passage by `quote`: a verbatim span of at most 30 words of it, found in no
# other passage of its chapter. No passage text is stored here, as one of the books isn't public.
#
# `set: development` cases choose the check's wording; `set: test` cases come from measurement
# runs that no wording was tried on, and only they decide whether the check ships switched on.
#
# The labels of the quiz run's 88 cases are the agent's, not yet reviewed: the owner left the review
# to the later feature that runs the check's proof (spec.md, Results of the implementation).

