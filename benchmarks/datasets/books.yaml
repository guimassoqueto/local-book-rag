# The three books of the benchmark. `book-rag fetch-benchmark-books` downloads them into
# benchmarks/books, and refuses a file that differs from the one the questions were written
# against. All three can be redistributed, so the benchmark is reproducible by anyone.
books:
  - key: quincas_borba
    role: Portuguese book
    title: Quincas Borba
    author: Machado de Assis
    language: pt
    filename: quincas-borba.epub
    url: https://www.gutenberg.org/ebooks/55682.epub3.images
    sha256: 6b3ba37e0343c339983cf2ff5402f2a10b6799e7a3d891daaed24889b9e343c0
    license: Public domain, from Project Gutenberg

  - key: think_python
    role: English book
    title: Think Python, 2nd edition
    author: Allen B. Downey
    language: en
    filename: think-python.pdf
    url: https://greenteapress.com/thinkpython2/thinkpython2.pdf
    sha256: 6033000bac3f9268ad75ee041bf8e5d9a3bc8a33bb156399cbd014918cb59f94
    license: Creative Commons Attribution-NonCommercial 3.0

  - key: on_liberty
    role: Book of complex arguments and conceptual relationships
    title: On Liberty
    author: John Stuart Mill
    language: en
    filename: on-liberty.epub
    url: https://www.gutenberg.org/ebooks/34901.epub3.images
    sha256: 5ace8dd56417e22dfc28916200dacd6ec58bc246c1d3faf93991a4b34a96af3d
    license: Public domain, from Project Gutenberg
