name: retrieval
kind: retrieval
description: >-
  Compares embedding models, retrieval strategies, reranking and chunk sizes on the same
  questions. Reranking runs on the GPU here for speed: no LLM needs the memory.

variants:
  - name: qwen3_dense
    overrides:
      retrieval: {strategy: dense, reranker: {enabled: false}}

  - name: bge_m3_dense
    overrides:
      embedding: {model: bge-m3}
      retrieval: {strategy: dense, reranker: {enabled: false}}

  - name: bm25
    overrides:
      retrieval: {strategy: bm25, reranker: {enabled: false}}

  - name: hybrid_weighted
    overrides:
      retrieval: {strategy: hybrid, fusion: {method: weighted}, reranker: {enabled: false}}

  - name: hybrid_rrf
    overrides:
      retrieval: {strategy: hybrid, fusion: {method: rrf}, reranker: {enabled: false}}

  - name: hybrid_rrf_qwen3_reranker
    overrides:
      retrieval: {strategy: hybrid, fusion: {method: rrf}, reranker: {enabled: true}}
      reranker: {device: cuda}

  - name: hybrid_rrf_bge_reranker
    overrides:
      retrieval: {strategy: hybrid, fusion: {method: rrf}, reranker: {enabled: true}}
      reranker: {model: BAAI/bge-reranker-v2-m3, device: cuda}

  - name: chunks_300
    overrides:
      chunking: {target_size: 300, overlap: 50}
      retrieval: {strategy: hybrid, fusion: {method: rrf}, reranker: {enabled: true}}
      reranker: {device: cuda}

  - name: chunks_800
    overrides:
      chunking: {target_size: 800, overlap: 120}
      retrieval: {strategy: hybrid, fusion: {method: rrf}, reranker: {enabled: true}}
      reranker: {device: cuda}
