name: generation
kind: generation
description: >-
  Compares the candidate LLMs on identical retrieved contexts, with one model judging them all.

judge:
  model: gpt-oss:20b
  embedding_model: qwen3-embedding:0.6b
  max_tokens: 6000
  reasoning: low

variants:
  - name: gpt_oss_20b
    overrides:
      llm: {model: "gpt-oss:20b"}

  - name: gemma4_12b
    overrides:
      llm: {model: "gemma4:12b"}

  - name: qwen3_5_9b
    overrides:
      llm: {model: "qwen3.5:9b"}

  - name: qwen3_14b
    overrides:
      llm: {model: "qwen3:14b"}
