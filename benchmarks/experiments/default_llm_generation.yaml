name: default_llm_generation
kind: generation
description: >-
  Confirms the comparison of gpt-oss:20b and gemma4:12b before choosing the default LLM
  (specs/002-gemma4-default-llm), with gpt-oss:20b judging. Only these two models, and the same
  judge as generation.yaml.

judge:
  model: gpt-oss:20b
  embedding_model: qwen3-embedding:0.6b
  max_tokens: 6000
  reasoning: low

variants:
  - name: gpt_oss_20b
    overrides:
      llm: {model: "gpt-oss:20b"}

  - name: gemma4_12b
    overrides:
      llm: {model: "gemma4:12b"}
