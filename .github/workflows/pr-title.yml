# A squash merge commits the pull request's title, and the release workflow reads that
# commit to choose the version bump. The commit-msg hook can't check a title written on
# GitHub, so this does: it must be a conventional commit header of at most 72 characters.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a conventional commit
        env:
          # Through the environment, never inline: the title is user input.
          TITLE: ${{ github.event.pull_request.title }}
        run: pipx run --spec "commitizen==4.19.3" cz check --message "$TITLE" -l 72
